[project]
name = "project-feedback"
version = "0.1.0"
description = "Weekly team feedback and retrospective tool"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==6.0",
    "gunicorn==26.0",
    "psycopg[binary]==3.3",
]

[dependency-groups]
dev = [
    "pytest==9.1",
    "pytest-django==4.12",
    "ruff==0.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

