{% extends "base.html" %}

{% block title %}Join {{ project.name }} · Project Feedback{% endblock %}

{% block content %}
  <section class="mx-auto max-w-lg rounded-xl border border-slate-200 bg-white p-8 text-center shadow-sm">
    <h1 class="text-2xl font-bold">Join {{ project.name }}?</h1>
    <p class="mt-3 text-slate-600">You will become a member of this project.</p>
    <form class="mt-6" method="post">
      {% csrf_token %}
      <button class="rounded-md bg-brand-600 px-4 py-2 font-medium text-white hover:bg-brand-700" type="submit">Join project</button>
    </form>
  </section>
{% endblock %}
