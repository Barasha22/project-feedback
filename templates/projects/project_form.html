{% extends "base.html" %}

{% block title %}New project · Project Feedback{% endblock %}

{% block content %}
  <section class="max-w-xl">
    <h1 class="text-3xl font-bold tracking-tight">Create a project</h1>
    <form class="mt-8 space-y-5" method="post">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label class="block text-sm font-medium text-slate-700" for="{{ field.id_for_label }}">{{ field.label }}</label>
          <div class="mt-1">{{ field }}</div>
          {% for error in field.errors %}<p class="mt-1 text-sm text-red-700">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
      <button class="rounded-md bg-brand-600 px-4 py-2 font-medium text-white hover:bg-brand-700" type="submit">Create project</button>
    </form>
  </section>
{% endblock %}
